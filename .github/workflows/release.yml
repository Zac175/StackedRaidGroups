# Releases Stacked Raid Groups whenever StackedRaidGroups.toc carries a version that has no tag yet.
#
# Push a commit that bumps "## Version:" in StackedRaidGroups.toc and this workflow:
#   1. tags the commit with that version (e.g. 1.2.0),
#   2. starts itself again on that tag, and that run
#   3. takes the version's notes from CHANGELOG.txt (the block under "v<version>"),
#   4. builds the zip and publishes it as a GitHub release and to CurseForge
#      (CF_API_KEY in the repo's secrets; the project id is in the TOC).
# A push whose version is already tagged does nothing.
#
# Why two steps: the packager only builds when the run itself is on a tag.
# A tag pushed from inside a run never starts a new run on its own, so the
# first run starts the second one by hand.
name: Release

on:
  push:
    branches: [main, master]
    paths: ["StackedRaidGroups.toc"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  tag:
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the version
        id: ver
        run: |
          v=$(grep -m1 -E '^## Version:' StackedRaidGroups.toc | sed -E 's/^## Version:[[:space:]]*//; s/[[:space:]\r]+$//')
          if [ -z "$v" ]; then echo "No version in StackedRaidGroups.toc"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$v" >/dev/null; then
            echo "Version $v is already tagged - nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          elif ! grep -q -E "^v${v//./\\.}( |\$)" CHANGELOG.txt; then
            echo "CHANGELOG.txt has no block for v$v - write it, then push again."
            exit 1
          else
            echo "Releasing $v."
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag this version
        if: steps.ver.outputs.new == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.ver.outputs.version }}" -m "Stacked Raid Groups ${{ steps.ver.outputs.version }}"
          git push origin "${{ steps.ver.outputs.version }}"

      - name: Build on the new tag
        if: steps.ver.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --repo "${{ github.repository }}" --ref "${{ steps.ver.outputs.version }}"

  package:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write the release notes
        run: |
          v="${{ github.ref_name }}"
          {
            echo "# Stacked Raid Groups $v"
            echo
            awk -v want="v$v" '
              /^v[0-9]/ { on = ($1 == want); next }
              on { sub(/\r$/, ""); print }
            ' CHANGELOG.txt
          } > CHANGELOG.md
          cat CHANGELOG.md
          if [ "$(wc -l < CHANGELOG.md)" -lt 3 ]; then echo "No notes for v$v in CHANGELOG.txt"; exit 1; fi

      - name: Build and publish
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
